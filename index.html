<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bio của Trumlovietnam</title>

<style>
    body {
        margin: 0;
        font-family: "Arial", sans-serif;
        background: #0b0f2f;
        color: white;
        text-align: center;
        height: 100vh;
        overflow-x: hidden;
        transition: 0.4s;
    }
    body.light {
        background: #f4f4f4;
        color: #111;
    }

    /* Nút chuyển chế độ */
    #themeToggle {
        position: fixed;
        top: 15px;
        right: 15px;
        font-size: 28px;
        cursor: pointer;
        z-index: 9999;
        user-select: none;
    }

    .container {
        margin-top: 20px;
        animation: fadeIn 1.5s ease-in-out;
    }

    /* Ảnh bìa */
    .cover-container {
        width: 90%;
        max-width: 500px;
        height: 180px;
        margin: 0 auto;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 0 25px rgba(0, 234, 255, 0.3);
        margin-bottom: 30px;
        position: relative;
    }

    .cover-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s;
    }

    .cover-container:hover .cover-img {
        transform: scale(1.05);
    }

    /* Avatar Neon */
    .avatar-container {
        position: relative;
        margin-top: -100px;
        z-index: 2;
    }

    .avatar {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #00eaff;
        box-shadow: 0 0 20px #00eaff;
        animation: neonPulse 2s infinite alternate;
        background-color: #0b0f2f;
        padding: 5px;
    }

    @keyframes neonPulse {
        0% { box-shadow: 0 0 15px #00eaff; }
        100% { box-shadow: 0 0 45px #00eaff; }
    }

    .name {
        margin-top: 20px;
        font-size: 30px;
        font-weight: bold;
        text-shadow: 0 0 12px #00eaff;
    }

    .info {
        margin-top: 10px;
        font-size: 18px;
        opacity: 0.9;
    }

    /* Player nhạc với ảnh */
    .music-player {
        width: 90%;
        max-width: 500px;
        margin: 30px auto;
        background: rgba(20, 25, 60, 0.8);
        border-radius: 15px;
        padding: 15px;
        box-shadow: 0 0 20px rgba(0, 234, 255, 0.4);
        display: flex;
        align-items: center;
        gap: 15px;
        transition: transform 0.3s;
    }

    body.light .music-player {
        background: rgba(230, 230, 250, 0.9);
    }

    .music-player:hover {
        transform: translateY(-5px);
    }

    .music-cover {
        width: 70px;
        height: 70px;
        border-radius: 10px;
        object-fit: cover;
        border: 2px solid #00eaff;
    }

    .music-info {
        flex-grow: 1;
        text-align: left;
    }

    .music-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 5px;
        color: #00eaff;
    }

    .music-controls {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .music-controls button {
        background: #00eaff;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        color: #0b0f2f;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .music-controls button:hover {
        background: #00b8cc;
        transform: scale(1.1);
    }

    .volume-slider {
        width: 80px;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }
    
    /* Tuyết 3D */
    .snowflake {
        position: fixed;
        top: -10px;
        color: white;
        opacity: 0.9;
        font-size: 1em;
        animation: fall linear infinite;
        filter: drop-shadow(0 0 5px white);
        z-index: 1;
    }

    @keyframes fall {
        0% { transform: translateY(-10px); }
        100% { transform: translateY(100vh); }
    }
</style>
</head>

<body>

<!-- Nút Dark/Light -->
<div id="themeToggle">🌓</div>

<!-- Nhạc nền -->
<audio id="music" loop playsinline>
    <source src="https://image2url.com/r2/default/audio/1768484762097-7d988b97-1d15-4672-81ff-2b0a7f4b0990.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <!-- Ảnh bìa -->
    <div class="cover-container">
        <img class="cover-img" src="https://www.image2url.com/r2/default/images/1785780581262-b40965b4-8883-4204-971b-895f34afda7a.gif" alt="Ảnh bìa">
    </div>
    
    <!-- Avatar -->
    <div class="avatar-container">
        <img class="avatar" src="https://www.image2url.com/r2/default/images/1785780489502-ef129ff2-9407-41ab-b447-60242dc016c4.jpeg" alt="Avatar">
    </div>
    
    <!-- Thông tin -->
    <div class="name">Ray</div>
    <div class="info">Sống tại: Singapore</div>

    <!-- Player nhạc với ảnh -->
    <div class="music-player">
        <img class="music-cover" src="https://www.image2url.com/r2/default/images/1785780910762-6d356a44-9495-4a77-9b4e-996da3b6ce88.gif" alt="Ảnh nhạc">
        
        <div class="music-info">
            <div class="music-title">Bài hát yêu thích</div>
            <div>Đang phát: 3IN1Tháng12AnhCó.mp3</div>
        </div>
        
        <div class="music-controls">
            <button id="playBtn">▶</button>
            <button id="pauseBtn">❚❚</button>
            <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
        </div>
    </div>
</div>

<script>
// Auto play nhạc khi trang tải
document.addEventListener("DOMContentLoaded", () => {
    const music = document.getElementById("music");
    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    
    // Đặt âm lượng mặc định
    music.volume = volumeSlider.value / 100;
    
    // Thử phát nhạc tự động
    setTimeout(() => { 
        music.play().catch(() => {
            console.log("Tự động phát nhạc bị chặn. Nhấn nút play để bắt đầu.");
        }); 
    }, 500);
    
    // Điều khiển phát nhạc
    playBtn.addEventListener("click", () => {
        music.play();
    });
    
    pauseBtn.addEventListener("click", () => {
        music.pause();
    });
    
    volumeSlider.addEventListener("input", () => {
        music.volume = volumeSlider.value / 100;
    });
});

/* ========== Dark / Light Mode ========== */
const themeBtn = document.getElementById("themeToggle");

if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
}

themeBtn.onclick = () => {
    document.body.classList.toggle("light");

    if (document.body.classList.contains("light"))
        localStorage.setItem("theme", "light");
    else
        localStorage.setItem("theme", "dark");
};

/* ========== Tuyết 3D ========== */
function snow3D() {
    const snow = document.createElement("div");
    snow.classList.add("snowflake");
    snow.textContent = "❄";

    snow.style.left = Math.random() * 100 + "vw";
    snow.style.fontSize = Math.random() * 14 + 10 + "px";
    snow.style.animationDuration = Math.random() * 4 + 3 + "s";

    document.body.appendChild(snow);
    setTimeout(() => snow.remove(), 6000);
}
setInterval(snow3D, 80);
</script>

</body>
</html>
